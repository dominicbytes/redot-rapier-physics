name: Redot Rapier2D contract

on:
  pull_request:
  push:
    branches:
      - main
      - redot-26.3
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUSTUP_TOOLCHAIN: "1.94.0"
  RAPIER2D_EXPORT_FEATURES: single-dim2,redot-compat,serde-serialize,parallel,godot/api-custom-json
  RAPIER2D_EDITOR_FEATURES: single-dim2,redot-compat,serde-serialize,parallel,register-docs,godot/api-custom-json
  RAPIER2D_DETERMINISM_FEATURES: single-dim2,redot-compat,serde-serialize,register-docs,godot/api-custom-json

defaults:
  run:
    shell: bash

jobs:
  identity:
    name: Read certified engine identity
    runs-on: ubuntu-24.04
    outputs:
      engine: ${{ steps.lock.outputs.engine }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Read lock
        id: lock
        run: |
          python3 -c 'import json, os; lock=json.load(open("redot.lock.json")); print("engine=" + lock["redot"]["version_output"], file=open(os.environ["GITHUB_OUTPUT"], "a"))'

  windows-x86-64:
    name: Windows x86-64
    needs: identity
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install the locked Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.94.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          rustup component add clippy rustfmt --toolchain 1.94.0
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          rustup default 1.94.0
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }

      - name: Download and verify the runtime and binding ABI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/prepare_redot.py --platform windows-x86_64 --with-binding-abi
          if ($LASTEXITCODE -ne 0) { throw 'Locked engine preparation failed' }

      - name: Validate the portable contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/redot_porting.py validate --redot-bin $env:REDOT_BIN
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          python -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          python scripts/verify_2d_parity.py --report reports/ci/windows/parity.json
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }

      - name: Remap native build and PDB paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $flags = python scripts/publication_paths.py rustflags --windows
          if ($LASTEXITCODE -ne 0) { throw 'Build path configuration failed' }
          "CARGO_ENCODED_RUSTFLAGS=$flags" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Lint, test, and build Rapier2D profiles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          New-Item -ItemType Directory -Force build/native | Out-Null
          # Lint and test without path remapping: remapped spans change how Clippy
          # recognizes proc-macro code. Only packaged builds need the remap.
          $remap = $env:CARGO_ENCODED_RUSTFLAGS
          Remove-Item Env:CARGO_ENCODED_RUSTFLAGS
          cargo clippy --config compat/rapier-cargo-config.toml --locked --no-default-features --features $env:RAPIER2D_EDITOR_FEATURES -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          cargo test --config compat/rapier-cargo-config.toml --locked --no-default-features --features $env:RAPIER2D_EDITOR_FEATURES
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          $env:CARGO_ENCODED_RUSTFLAGS = $remap
          cargo --config compat/rapier-cargo-config.toml build --locked --no-default-features --features $env:RAPIER2D_EDITOR_FEATURES
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          Copy-Item -LiteralPath target/debug/godot_rapier.dll -Destination build/native/windows-editor.dll -Force
          cargo --config compat/rapier-cargo-config.toml build --locked --no-default-features --features $env:RAPIER2D_EXPORT_FEATURES
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          Copy-Item -LiteralPath target/debug/godot_rapier.dll -Destination build/native/windows-debug.dll -Force
          cargo --config compat/rapier-cargo-config.toml build --locked --release --no-default-features --features $env:RAPIER2D_EXPORT_FEATURES
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          Copy-Item -LiteralPath target/release/godot_rapier.dll -Destination build/native/windows-release.dll -Force
          cargo --config compat/rapier-cargo-config.toml build --locked --target-dir target/deterministic --no-default-features --features $env:RAPIER2D_DETERMINISM_FEATURES
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          Copy-Item -LiteralPath target/deterministic/debug/godot_rapier.dll -Destination build/native/windows-deterministic.dll -Force

      - name: Stage and run Redot import, smoke, unit, feature, and regression suites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $addonBin = "bin2d/addons/godot-rapier2d/bin"
          New-Item -ItemType Directory -Force $addonBin | Out-Null
          Copy-Item -LiteralPath build/native/windows-editor.dll -Destination "$addonBin/libgodot_rapier.windows.editor.x86_64-pc-windows-msvc.dll" -Force
          Copy-Item -LiteralPath build/native/windows-debug.dll -Destination "$addonBin/libgodot_rapier.windows.debug.x86_64-pc-windows-msvc.dll" -Force
          Copy-Item -LiteralPath build/native/windows-release.dll -Destination "$addonBin/libgodot_rapier.windows.release.x86_64-pc-windows-msvc.dll" -Force
          New-Item -ItemType Directory -Force reports/ci/windows | Out-Null
          $evidence = (Resolve-Path reports/ci/windows).Path
          python scripts/engine_gate.py --engine $env:REDOT_BIN --log "$evidence/import.log" --import-allowlist compat/redot-26.3-import-allowlist.json -- --headless --audio-driver Dummy --path bin2d --import --quit-after 300
          if ($LASTEXITCODE -ne 0) { throw "Redot import failed" }
          python scripts/engine_gate.py --engine $env:REDOT_BIN --log "$evidence/smoke.log" --sentinel "REDOT RAPIER2D COMPATIBILITY SMOKE: SUCCESS" -- --headless --audio-driver Dummy --fixed-fps 60 --path bin2d --scene res://test/redot/compatibility_smoke.tscn --quit-after 600
          if ($LASTEXITCODE -ne 0) { throw "Rapier2D smoke failed" }
          python scripts/engine_gate.py --engine $env:REDOT_BIN --log "$evidence/regression.log" --sentinel "STATUS: SUCCESS" --timeout 900 --scene-timeout 120 -- --headless --audio-driver Dummy --fixed-fps 60 --path bin2d --quit-after 30000
          if ($LASTEXITCODE -ne 0) { throw "Rapier2D regression failed" }
          python scripts/engine_gate.py --engine $env:REDOT_BIN --log "$evidence/unit.log" --sentinel "UNIT TESTS STATUS: SUCCESS" -- --headless --audio-driver Dummy --fixed-fps 60 --path bin2d --scene res://test/unit/run_unit_tests.tscn --quit-after 1200
          if ($LASTEXITCODE -ne 0) { throw "Rapier2D unit scene failed" }
          python scripts/engine_gate.py --engine $env:REDOT_BIN --log "$evidence/feature-parity.log" --sentinel "REDOT RAPIER2D FEATURE PARITY: SUCCESS" -- --headless --audio-driver Dummy --fixed-fps 60 --path bin2d --scene res://test/redot/feature_parity_smoke.tscn --quit-after 1200
          if ($LASTEXITCODE -ne 0) { throw "Rapier2D feature parity smoke failed" }
          if (-not (Select-String -Quiet -LiteralPath "$evidence/smoke.log" -Pattern "REDOT RAPIER2D COMPATIBILITY SMOKE: SUCCESS")) {
            throw "Rapier2D smoke sentinel missing"
          }
          if (-not (Select-String -Quiet -LiteralPath "$evidence/regression.log" -Pattern "STATUS: SUCCESS")) {
            throw "Rapier2D regression success sentinel missing"
          }
          if (-not (Select-String -Quiet -LiteralPath "$evidence/unit.log" -Pattern "UNIT TESTS STATUS: SUCCESS")) {
            throw "Rapier2D unit success sentinel missing"
          }
          if (-not (Select-String -Quiet -LiteralPath "$evidence/feature-parity.log" -Pattern "REDOT RAPIER2D FEATURE PARITY: SUCCESS")) {
            throw "Rapier2D feature parity sentinel missing"
          }
          Get-FileHash -Algorithm SHA256 "$addonBin/libgodot_rapier.windows.*.x86_64-pc-windows-msvc.dll" | ForEach-Object { @{ file = (Split-Path $_.Path -Leaf); sha256 = $_.Hash.ToLowerInvariant() } } | ConvertTo-Json | Out-File "$evidence/binary-sha256.json" -Encoding utf8

      - name: Prove the Windows deterministic profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $addonBin = "bin2d/addons/godot-rapier2d/bin"
          $evidence = (Resolve-Path reports/ci/windows).Path
          $determinism = Join-Path $evidence "determinism"
          New-Item -ItemType Directory -Force $determinism | Out-Null
          Copy-Item -LiteralPath build/native/windows-deterministic.dll -Destination "$addonBin/libgodot_rapier.windows.editor.x86_64-pc-windows-msvc.dll" -Force
          for ($run = 1; $run -le 3; $run++) {
            $output = Join-Path $determinism "run-$run.json"
            $log = Join-Path $determinism "run-$run.log"
            python scripts/engine_gate.py --engine $env:REDOT_BIN --log $log --sentinel "DETERMINISM_TEST: STATUS=SUCCESS" --result "$output" -- --headless --audio-driver Dummy --fixed-fps 60 --path bin2d --scene res://tests/determinism/determinism_test.tscn --quit-after 1200 -- "--rapier-determinism-output=$output"
            if ($LASTEXITCODE -ne 0) { throw "Determinism run $run failed" }
          }
          python scripts/compare_determinism.py "$determinism/run-1.json" "$determinism/run-2.json" "$determinism/run-3.json" --report "$determinism/comparison.json"
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          Copy-Item -LiteralPath build/native/windows-editor.dll -Destination "$addonBin/libgodot_rapier.windows.editor.x86_64-pc-windows-msvc.dll" -Force

      - name: Run the Windows performance guardrail
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = (Resolve-Path reports/ci/windows).Path
          $performance = Join-Path $evidence "performance"
          python scripts/performance_guardrail.py run --backend default --redot-bin $env:REDOT_BIN --output-dir $performance
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          python scripts/performance_guardrail.py run --backend rapier --redot-bin $env:REDOT_BIN --output-dir $performance
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          python scripts/performance_guardrail.py compare --baseline "$performance/performance-default.json" --candidate "$performance/performance-rapier.json" --output "$performance/comparison.json"
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }

      - name: Sanitize and scan publication inputs
        id: publication
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force reports/ci/windows,build/native,build/redot/engine-api,build/redot/binding-api | Out-Null
          python scripts/publication_paths.py sanitize reports/ci/windows
          if ($LASTEXITCODE -ne 0) { throw 'Evidence sanitization failed' }
          python scripts/publication_paths.py scan reports/ci/windows build/native build/redot/engine-api build/redot/binding-api
          if ($LASTEXITCODE -ne 0) { throw 'Publication path scan failed' }

      - name: Upload Windows evidence
        if: always() && steps.publication.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rapier2d-windows-evidence-${{ needs.identity.outputs.engine }}
          path: |
            build/redot/engine-api
            build/redot/binding-api
            build/native
            reports/ci/windows
          if-no-files-found: warn
          retention-days: 90

  linux-x86-64:
    name: Linux x86-64
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install the locked Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal
          rustup component add clippy rustfmt --toolchain 1.94.0
          rustup default 1.94.0

      - name: Download and verify the runtime and binding ABI
        run: |
          set -euo pipefail
          python3 scripts/prepare_redot.py --platform linux-x86_64 --with-binding-abi

      - name: Validate the portable contract
        run: |
          set -euo pipefail
          python3 scripts/redot_porting.py validate --redot-bin "$REDOT_BIN"
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/verify_2d_parity.py --report reports/ci/linux/parity.json

      - name: Remap native build paths
        run: |
          set -euo pipefail
          flags="$(python3 scripts/publication_paths.py rustflags)"
          echo "CARGO_ENCODED_RUSTFLAGS=$flags" >> "$GITHUB_ENV"

      - name: Lint, test, and build Rapier2D profiles
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          mkdir -p build/native
          # Lint and test without path remapping: remapped spans change how Clippy
          # recognizes proc-macro code. Only packaged builds need the remap.
          env -u CARGO_ENCODED_RUSTFLAGS cargo clippy --config compat/rapier-cargo-config.toml --locked --no-default-features --features "$RAPIER2D_EDITOR_FEATURES" -- -D warnings
          env -u CARGO_ENCODED_RUSTFLAGS cargo test --config compat/rapier-cargo-config.toml --locked --no-default-features --features "$RAPIER2D_EDITOR_FEATURES"
          cargo --config compat/rapier-cargo-config.toml build --locked --no-default-features --features "$RAPIER2D_EDITOR_FEATURES"
          cp target/debug/libgodot_rapier.so build/native/linux-editor.so
          cargo --config compat/rapier-cargo-config.toml build --locked --no-default-features --features "$RAPIER2D_EXPORT_FEATURES"
          cp target/debug/libgodot_rapier.so build/native/linux-debug.so
          cargo --config compat/rapier-cargo-config.toml build --locked --release --no-default-features --features "$RAPIER2D_EXPORT_FEATURES"
          cp target/release/libgodot_rapier.so build/native/linux-release.so
          cargo --config compat/rapier-cargo-config.toml build --locked --target-dir target/deterministic --no-default-features --features "$RAPIER2D_DETERMINISM_FEATURES"
          cp target/deterministic/debug/libgodot_rapier.so build/native/linux-deterministic.so
          strip --strip-debug build/native/linux-editor.so build/native/linux-debug.so build/native/linux-release.so

      - name: Stage and run Redot import, smoke, unit, feature, and regression suites
        run: |
          set -euo pipefail
          addon_bin="bin2d/addons/godot-rapier2d/bin"
          mkdir -p "$addon_bin" reports/ci/linux
          cp build/native/linux-editor.so "$addon_bin/libgodot_rapier.linux.editor.x86_64-unknown-linux-gnu.so"
          cp build/native/linux-debug.so "$addon_bin/libgodot_rapier.linux.debug.x86_64-unknown-linux-gnu.so"
          cp build/native/linux-release.so "$addon_bin/libgodot_rapier.linux.release.x86_64-unknown-linux-gnu.so"
          python3 scripts/engine_gate.py --engine "$REDOT_BIN" --log "$GITHUB_WORKSPACE/reports/ci/linux/import.log" --import-allowlist compat/redot-26.3-import-allowlist.json -- --headless --audio-driver Dummy --path bin2d --import --quit-after 300
          python3 scripts/engine_gate.py --engine "$REDOT_BIN" --log "$GITHUB_WORKSPACE/reports/ci/linux/smoke.log" --sentinel "REDOT RAPIER2D COMPATIBILITY SMOKE: SUCCESS" -- --headless --audio-driver Dummy --fixed-fps 60 --path bin2d --scene res://test/redot/compatibility_smoke.tscn --quit-after 600
          python3 scripts/engine_gate.py --engine "$REDOT_BIN" --log "$GITHUB_WORKSPACE/reports/ci/linux/regression.log" --sentinel "STATUS: SUCCESS" --timeout 900 --scene-timeout 120 -- --headless --audio-driver Dummy --fixed-fps 60 --path bin2d --quit-after 30000
          python3 scripts/engine_gate.py --engine "$REDOT_BIN" --log "$GITHUB_WORKSPACE/reports/ci/linux/unit.log" --sentinel "UNIT TESTS STATUS: SUCCESS" -- --headless --audio-driver Dummy --fixed-fps 60 --path bin2d --scene res://test/unit/run_unit_tests.tscn --quit-after 1200
          python3 scripts/engine_gate.py --engine "$REDOT_BIN" --log "$GITHUB_WORKSPACE/reports/ci/linux/feature-parity.log" --sentinel "REDOT RAPIER2D FEATURE PARITY: SUCCESS" -- --headless --audio-driver Dummy --fixed-fps 60 --path bin2d --scene res://test/redot/feature_parity_smoke.tscn --quit-after 1200
          grep -Fq "REDOT RAPIER2D COMPATIBILITY SMOKE: SUCCESS" reports/ci/linux/smoke.log
          grep -Fq "STATUS: SUCCESS" reports/ci/linux/regression.log
          grep -Fq "UNIT TESTS STATUS: SUCCESS" reports/ci/linux/unit.log
          grep -Fq "REDOT RAPIER2D FEATURE PARITY: SUCCESS" reports/ci/linux/feature-parity.log
          sha256sum "$addon_bin"/libgodot_rapier.linux.*.x86_64-unknown-linux-gnu.so > reports/ci/linux/binary.sha256

      - name: Prove the Linux deterministic profile
        run: |
          set -euo pipefail
          addon_bin="bin2d/addons/godot-rapier2d/bin"
          determinism="reports/ci/linux/determinism"
          mkdir -p "$determinism"
          cp build/native/linux-deterministic.so "$addon_bin/libgodot_rapier.linux.editor.x86_64-unknown-linux-gnu.so"
          for run in 1 2 3; do
            output="$GITHUB_WORKSPACE/$determinism/run-$run.json"
            python3 scripts/engine_gate.py --engine "$REDOT_BIN" --log "$GITHUB_WORKSPACE/$determinism/run-$run.log" --sentinel "DETERMINISM_TEST: STATUS=SUCCESS" --result "$output" -- --headless --audio-driver Dummy --fixed-fps 60 --path bin2d --scene res://tests/determinism/determinism_test.tscn --quit-after 1200 -- "--rapier-determinism-output=$output"
          done
          python3 scripts/compare_determinism.py "$determinism/run-1.json" "$determinism/run-2.json" "$determinism/run-3.json" --report "$determinism/comparison.json"
          cp build/native/linux-editor.so "$addon_bin/libgodot_rapier.linux.editor.x86_64-unknown-linux-gnu.so"

      - name: Run the Linux performance guardrail
        run: |
          set -euo pipefail
          performance="reports/ci/linux/performance"
          python3 scripts/performance_guardrail.py run --backend default --redot-bin "$REDOT_BIN" --output-dir "$performance"
          python3 scripts/performance_guardrail.py run --backend rapier --redot-bin "$REDOT_BIN" --output-dir "$performance"
          python3 scripts/performance_guardrail.py compare --baseline "$performance/performance-default.json" --candidate "$performance/performance-rapier.json" --output "$performance/comparison.json"

      - name: Sanitize and scan publication inputs
        id: publication
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force reports/ci/linux,build/native,build/redot/engine-api,build/redot/binding-api | Out-Null
          python scripts/publication_paths.py sanitize reports/ci/linux
          if ($LASTEXITCODE -ne 0) { throw 'Evidence sanitization failed' }
          python scripts/publication_paths.py scan reports/ci/linux build/native build/redot/engine-api build/redot/binding-api
          if ($LASTEXITCODE -ne 0) { throw 'Publication path scan failed' }

      - name: Upload Linux evidence
        if: always() && steps.publication.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rapier2d-linux-evidence-${{ needs.identity.outputs.engine }}
          path: |
            build/redot/engine-api
            build/redot/binding-api
            build/native
            reports/ci/linux
          if-no-files-found: warn
          retention-days: 90

  package:
    name: Deterministic desktop package
    needs:
      - identity
      - windows-x86-64
      - linux-x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Install the locked Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0

      - name: Download Windows native artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: rapier2d-windows-evidence-${{ needs.identity.outputs.engine }}
          path: build/from-windows

      - name: Download Linux native artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: rapier2d-linux-evidence-${{ needs.identity.outputs.engine }}
          path: build/from-linux

      - name: Stage the exact six-profile payload
        run: |
          set -euo pipefail
          addon_bin="bin2d/addons/godot-rapier2d/bin"
          mkdir -p "$addon_bin" reports/ci/package build/package-a build/package-b
          cp build/from-windows/build/native/windows-editor.dll "$addon_bin/libgodot_rapier.windows.editor.x86_64-pc-windows-msvc.dll"
          cp build/from-windows/build/native/windows-debug.dll "$addon_bin/libgodot_rapier.windows.debug.x86_64-pc-windows-msvc.dll"
          cp build/from-windows/build/native/windows-release.dll "$addon_bin/libgodot_rapier.windows.release.x86_64-pc-windows-msvc.dll"
          cp build/from-linux/build/native/linux-editor.so "$addon_bin/libgodot_rapier.linux.editor.x86_64-unknown-linux-gnu.so"
          cp build/from-linux/build/native/linux-debug.so "$addon_bin/libgodot_rapier.linux.debug.x86_64-unknown-linux-gnu.so"
          cp build/from-linux/build/native/linux-release.so "$addon_bin/libgodot_rapier.linux.release.x86_64-unknown-linux-gnu.so"

      - name: Verify legal metadata, parity, determinism, and packaging
        run: |
          set -euo pipefail
          export GDRUST_GODOT_API_JSON="$GITHUB_WORKSPACE/build/from-linux/build/redot/binding-api/extension_api.json"
          python3 scripts/generate_distribution_metadata.py --cargo "$(command -v cargo)" --api "$GDRUST_GODOT_API_JSON" --check
          python3 scripts/redot_porting.py package --output-dir build/package-a --report reports/ci/package/package-a.json
          python3 scripts/redot_porting.py package --output-dir build/package-b --report reports/ci/package/package-b.json
          archive="$(python3 -c 'import json; print("redot-rapier-physics-2d-" + json.load(open("porting.json"))["product"]["release_version"] + ".zip")')"
          cmp "build/package-a/$archive" "build/package-b/$archive"
          python3 scripts/redot_porting.py verify-package --archive "build/package-a/$archive" --report reports/ci/package/verification.json
          python3 scripts/verify_2d_parity.py --archive "build/package-a/$archive" --report reports/ci/package/parity.json
          python3 scripts/compare_determinism.py \
            build/from-windows/reports/ci/windows/determinism/run-1.json \
            build/from-windows/reports/ci/windows/determinism/run-2.json \
            build/from-windows/reports/ci/windows/determinism/run-3.json \
            build/from-linux/reports/ci/linux/determinism/run-1.json \
            build/from-linux/reports/ci/linux/determinism/run-2.json \
            build/from-linux/reports/ci/linux/determinism/run-3.json \
            --report reports/ci/package/determinism-cross-platform.json
          sha256sum "build/package-a/$archive" > reports/ci/package/archive.sha256

      - name: Sanitize and scan publication inputs
        id: publication
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force reports/ci/package,build/package-a | Out-Null
          python scripts/publication_paths.py sanitize reports/ci/package
          if ($LASTEXITCODE -ne 0) { throw 'Evidence sanitization failed' }
          python scripts/publication_paths.py scan reports/ci/package build/package-a compat/provenance/rapier2d-exact-feature-licenses.json compat/provenance/rapier2d-sbom.spdx.json
          if ($LASTEXITCODE -ne 0) { throw 'Publication path scan failed' }

      - name: Upload the unpublished package candidate
        if: success() && steps.publication.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: redot-rapier2d-unpublished-candidate-${{ needs.identity.outputs.engine }}
          path: |
            build/package-a/*.zip
            build/package-a/*.json
            reports/ci/package
            compat/provenance/rapier2d-exact-feature-licenses.json
            compat/provenance/rapier2d-sbom.spdx.json
          if-no-files-found: error
          retention-days: 90

  clean-install:
    name: Clean install (${{ matrix.os }})
    needs: [identity, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Download package candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: redot-rapier2d-unpublished-candidate-${{ needs.identity.outputs.engine }}
          path: build/candidate

      - name: Download and verify the locked runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/prepare_redot.py --platform ${{ matrix.platform }}-x86_64
          if ($LASTEXITCODE -ne 0) { throw 'Locked engine preparation failed' }

      - name: Materialize and run selected/default controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = (Get-ChildItem build/candidate -Recurse -Filter 'redot-rapier-physics-2d-*.zip' | Select-Object -First 1).FullName
          python scripts/redot_porting.py materialize-clean-install --archive $package --fixture tests/fixtures/rapier2d-clean-install --project-config tests/fixtures/rapier2d-clean-install/project.godot --output build/clean-selected
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          python scripts/redot_porting.py materialize-clean-install --archive $package --fixture tests/fixtures/rapier2d-clean-install --project-config tests/fixtures/rapier2d-clean-install/project.default.godot --output build/clean-default
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          New-Item -ItemType Directory -Force reports/ci/clean-${{ matrix.platform }} | Out-Null
          $evidence = (Resolve-Path reports/ci/clean-${{ matrix.platform }}).Path
          python scripts/engine_gate.py --engine $env:REDOT_BIN --log "$evidence/selected-import.log" --import-allowlist compat/redot-26.3-import-allowlist.json -- --headless --audio-driver Dummy --path build/clean-selected --import --quit-after 300
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          python scripts/engine_gate.py --engine $env:REDOT_BIN --log "$evidence/selected.log" --result "$evidence/selected.json" --backend "Rapier2D" --sentinel "REDOT RAPIER2D CLEAN INSTALL: SUCCESS" -- --headless --audio-driver Dummy --fixed-fps 60 --path build/clean-selected --scene res://main.tscn --quit-after 600
          if ($LASTEXITCODE -ne 0) { throw 'Selected clean install failed' }
          python scripts/engine_gate.py --engine $env:REDOT_BIN --log "$evidence/default-import.log" --import-allowlist compat/redot-26.3-import-allowlist.json -- --headless --audio-driver Dummy --path build/clean-default --import --quit-after 300
          if ($LASTEXITCODE -ne 0) { throw "Native command failed" }
          python scripts/engine_gate.py --engine $env:REDOT_BIN --log "$evidence/default.log" --result "$evidence/default.json" --backend "DEFAULT" --sentinel "REDOT RAPIER2D DEFAULT CONTROL: SUCCESS" -- --headless --audio-driver Dummy --fixed-fps 60 --path build/clean-default --scene res://main.tscn --quit-after 600
          if ($LASTEXITCODE -ne 0) { throw 'Default clean install control failed' }

      - name: Sanitize and scan publication inputs
        id: publication
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force reports/ci/clean-${{ matrix.platform }} | Out-Null
          python scripts/publication_paths.py sanitize reports/ci/clean-${{ matrix.platform }}
          if ($LASTEXITCODE -ne 0) { throw 'Evidence sanitization failed' }
          python scripts/publication_paths.py scan reports/ci/clean-${{ matrix.platform }}
          if ($LASTEXITCODE -ne 0) { throw 'Publication path scan failed' }

      - name: Upload clean-install evidence
        if: always() && steps.publication.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rapier2d-clean-install-${{ matrix.platform }}-${{ needs.identity.outputs.engine }}
          path: reports/ci/clean-${{ matrix.platform }}
          if-no-files-found: warn
          retention-days: 90

  full-export-gate:
    name: Full debug/release export gate (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch'
    needs: [identity, package, clean-install]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            preset: Windows x86-64
            extension: exe
          - os: ubuntu-24.04
            platform: linux
            preset: Linux x86-64
            extension: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Download package candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: redot-rapier2d-unpublished-candidate-${{ needs.identity.outputs.engine }}
          path: build/candidate

      - name: Download and verify the locked runtime and export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/prepare_redot.py --platform ${{ matrix.platform }}-x86_64 --with-templates
          if ($LASTEXITCODE -ne 0) { throw 'Locked engine preparation failed' }

      - name: Export and run supported debug/release products
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem build/candidate -Recurse -File -Filter 'redot-rapier-physics-2d-*.zip')
          if ($packages.Count -ne 1) { throw 'Expected exactly one package candidate' }
          python scripts/redot_porting.py materialize-clean-install --archive $packages[0].FullName --fixture tests/fixtures/rapier2d-clean-install --project-config tests/fixtures/rapier2d-clean-install/project.godot --output build/export-project
          if ($LASTEXITCODE -ne 0) { throw 'Materialization failed' }
          python scripts/redot_porting.py configure-export-templates --project build/export-project --windows-debug-template build/redot/export-templates/templates/windows_debug_x86_64.exe --windows-release-template build/redot/export-templates/templates/windows_release_x86_64.exe --linux-debug-template build/redot/export-templates/templates/linux_debug.x86_64 --linux-release-template build/redot/export-templates/templates/linux_release.x86_64
          if ($LASTEXITCODE -ne 0) { throw 'Template configuration failed' }
          New-Item -ItemType Directory -Force build/exports,reports/ci/full-export | Out-Null
          $exports = (Resolve-Path build/exports).Path
          $evidence = (Resolve-Path reports/ci/full-export).Path
          python scripts/engine_gate.py --engine $env:REDOT_BIN --log "$evidence/import.log" --import-allowlist compat/redot-26.3-import-allowlist.json -- --headless --audio-driver Dummy --path build/export-project --import --quit-after 300
          if ($LASTEXITCODE -ne 0) { throw 'Export project import failed' }
          foreach ($profile in @('debug', 'release')) {
            $product = Join-Path $exports "${{ matrix.platform }}-$profile.${{ matrix.extension }}"
            python scripts/engine_gate.py --engine $env:REDOT_BIN --log "$evidence/$profile-export.log" -- --headless --audio-driver Dummy --path build/export-project "--export-$profile" '${{ matrix.preset }}' $product --quit-after 300
            if ($LASTEXITCODE -ne 0) { throw 'Export failed' }
            if ('${{ matrix.platform }}' -eq 'linux') {
              chmod +x $product
              if ($LASTEXITCODE -ne 0) { throw 'chmod failed' }
            }
            python scripts/engine_gate.py --engine $product --log "$evidence/$profile-runtime.log" --sentinel 'REDOT RAPIER2D CLEAN INSTALL: SUCCESS' --result "$evidence/$profile.json" --backend Rapier2D -- --headless --audio-driver Dummy --quit-after 600
            if ($LASTEXITCODE -ne 0) { throw 'Export runtime failed' }
          }

      - name: Sanitize and scan publication inputs
        id: publication
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force reports/ci/full-export | Out-Null
          python scripts/publication_paths.py sanitize reports/ci/full-export
          if ($LASTEXITCODE -ne 0) { throw 'Evidence sanitization failed' }
          python scripts/publication_paths.py scan reports/ci/full-export
          if ($LASTEXITCODE -ne 0) { throw 'Publication path scan failed' }

      - name: Upload full-export evidence
        if: always() && steps.publication.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rapier2d-full-export-evidence-${{ matrix.platform }}-${{ needs.identity.outputs.engine }}
          path: reports/ci/full-export
          if-no-files-found: warn
          retention-days: 90
