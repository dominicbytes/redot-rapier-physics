name: 🔗 Builds
on: 
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    if: github.repository == 'appsinacup/godot-rapier-physics'
    name: 📊 Static checks
    uses: ./.github/workflows/static_checks.yml

  test-checks:
    if: github.repository == 'appsinacup/godot-rapier-physics'
    name: 🧪 Run Tests
    needs: [static-checks]
    uses: ./.github/workflows/test_checks.yml

  compatibility-checks:
    if: github.repository == 'appsinacup/godot-rapier-physics'
    name: 🧩 Compatibility Checks
    needs: [static-checks]
    uses: ./.github/workflows/compatibility_checks.yml

  determinism-checks:
    if: github.repository == 'appsinacup/godot-rapier-physics'
    name: 🎯 Determinism
    needs: [linux-build, macos-build, windows-build]
    uses: ./.github/workflows/determinism_checks.yml

  android-build:
    if: github.repository == 'appsinacup/godot-rapier-physics'
    name: 🤖 Android
    needs: [static-checks]
    uses: ./.github/workflows/android_builds.yml

  ios-build:
    if: github.repository == 'appsinacup/godot-rapier-physics'
    name: 🍏 iOS
    needs: [static-checks]
    uses: ./.github/workflows/ios_builds.yml

  linux-build:
    if: github.repository == 'appsinacup/godot-rapier-physics'
    name: 🐧 Linux
    needs: [static-checks]
    uses: ./.github/workflows/linux_builds.yml

  macos-build:
    if: github.repository == 'appsinacup/godot-rapier-physics'
    name: 🍎 macOS
    needs: [static-checks]
    uses: ./.github/workflows/macos_builds.yml
    secrets: inherit

  windows-build:
    if: github.repository == 'appsinacup/godot-rapier-physics'
    name: 🏁 Windows
    needs: [static-checks]
    uses: ./.github/workflows/windows_builds.yml

  godot-build:
    if: github.repository == 'appsinacup/godot-rapier-physics'
    name:  Godot
    needs: [static-checks]
    uses: ./.github/workflows/godot_builds.yml

  web-build:
    if: github.repository == 'appsinacup/godot-rapier-physics'
    name: 🌐 Web Builds
    needs: [static-checks]
    uses: ./.github/workflows/web_builds.yml

  merge:
    if: github.repository == 'appsinacup/godot-rapier-physics'
    runs-on: ubuntu-latest
    name: Merge
    needs: [test-checks, compatibility-checks, determinism-checks, android-build, ios-build, linux-build, macos-build, windows-build, godot-build, web-build]
    steps:
      # dynamic
      - uses: actions/upload-artifact/merge@v6
        with:
          name: godot-rapier-2d-single
          pattern: godot-rapier-2d-single-*
      - uses: actions/upload-artifact/merge@v6
        with:
          name: godot-rapier-3d-single
          pattern: godot-rapier-3d-single-*
      # static
      - uses: actions/upload-artifact/merge@v6
        with:
          name: static-rapier-2d-single
          pattern: static-rapier-2d-single-*
      - uses: actions/upload-artifact/merge@v6
        with:
          name: static-rapier-3d-single
          pattern: static-rapier-3d-single-*

  release:
    name: Create Release
    permissions:
      contents: write
    needs: [merge]
    uses: ./.github/workflows/release.yml
    if: github.repository == 'appsinacup/godot-rapier-physics' && github.ref == 'refs/heads/main'
